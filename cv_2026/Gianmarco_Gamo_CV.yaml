cv:
  name: Gianmarco Dancel Gamo
  headline: 'Software engineer · full-stack & industrial systems · MSc CS&E student, Politecnico di Milano'
  intro: |-
    What I love most about engineering is finding the one problem hiding behind many, and the one well-proven solution that settles them all. I like greedy solutions and heuristics more than I should: they are fast, and they ship. But the answers I am proudest of are the exact ones, backed by proofs or numbers.

    After two years of shipping, I went back to school to tackle new problems, satisfying my itch to do more, and to do it cooler.
  location: Brescia, IT
  email: gamogianmarco@gmail.com
  phone: +39 324 825 1107
  website:
  social_networks:
    - network: LinkedIn
      username: gianmarcogamo
  sections:
    education:
      - institution: Politecnico di Milano
        area: Computer Science and Engineering
        degree: MSc
        grade: 'Expected 2028'
        start_date: 2026-09
        end_date: present
        location: Milan, IT
        summary: 'Current coursework: Operations Research, Software Engineering 2, Data Bases 2, Formal Languages and Compilers.'
        highlights:
      - institution: Università degli Studi di Brescia
        area: Engineering of Digital Enterprise Technologies (ITID)
        degree: BSc
        grade: 'Grade: 109/110'
        start_date: 2020-09
        end_date: 2024-03
        location: Brescia, IT
        summary: 'GPA 27.9/30 (3 with honours). Coursework: Signals & Telecommunications, Mathematical Analysis, Automation & Control, Measurement Systems, Intelligent Systems & Robotics.'
        highlights:
          - '**GREEN FBK** — One of 30 students selected for an embedded-systems workshop on smart cities; built an air-quality monitor in C.'
      - institution: IIS Benedetto Castelli
        area: Computer Science & Telecommunications
        degree: Diploma
        grade: 'Grade: 100 cum laude'
        start_date: 2015-09
        end_date: 2020-06
        location: Brescia, IT
        summary:
        highlights:
          - '**mo.Ve** — Ranked 1st of 50 applicants for a work-experience programme in Berlin.'
          - '**WebValley 2019** — One of 20 students selected internationally for an AI & Health research camp organised by FBK. Built a cardiovascular-risk model and a microbiota network analysis in Python.'
    experience:
      - company: Freelance
        position: Software Engineer
        start_date: 2026-01
        end_date: present
        location: Brescia, IT
        summary:
        highlights:
          - '**Pyromac (Sept 2026 – present)** — Web editor for programming pyromusical shows (Next.js, TypeScript) with a waveform-synced, keyboard-driven cue list.'
          - '**Pyromac tester (May – July 2026)** — Sole engineer of the end-of-line QA system for a pyrotechnic firing system: Python SDK for the RS485 protocol with CRC-validated transport, bus sniffer, test wizard driving Arduino relays and a SCPI power supply.'
          - '**Autosupermarket (Jan – Apr 2026)** — Extended the back-office CRM of a high-traffic Symfony/Vue platform: one-off digital contracts, subscription-expiry tracking and post-sale customer-contact workflows, plus fixing N+1 query bottlenecks.'
      - company: Tecnosens SpA
        position: Software Engineer
        start_date: 2024-07
        end_date: 2026-01
        location: Brescia, IT
        summary:
        highlights:
          - '**Redesigned the backend of two production QC applications**: documented the existing architecture, then rebuilt it around loosely coupled, single-responsibility components, so each client''s sensors and product variants plug in without rewrites.'
          - 'Built WPF/.NET software driving QC machines on live production lines: async orchestration of motion control, PLC/Modbus signals and data acquisition.'
          - 'Shipped a real-time inline inspection system running at 60–100 units/min.'
          - 'On site for commissioning and prototype validation at customer plants, including measurement system analysis (Gage R&R): characterised mean and variance across operating conditions to confirm reliable pass/reject decisions.'
    projects:
      - name: 'Pyromac customer portal'
        start_date: 2025-10
        end_date: 2026-02
        summary:
        highlights:
          - 'Production portal (FastAPI/React): OTP contract signing, AES-GCM/RSA encryption, RFC 3161 certified timestamps, and a Vertex AI Search assistant over product manuals.'
      - name: 'Real-time voting app for social-deduction board games'
        date: 2026-05
        summary:
        highlights:
          - 'Replaced physical ballot cards with a phone-based voting flow: QR join, live lobby and host-controlled reveal over WebSockets (SvelteKit, TypeScript).'
          - 'Enforced strict ballot anonymity server-side (clients only ever receive aggregates), with reconnect handling and unit/integration tests; self-hosted via Docker and Cloudflare Tunnel.'
      - name: 'Thesis: "OCR in the Wild"'
        start_date: 2023-11
        end_date: 2024-03
        summary:
        highlights:
          - 'Reviewed and compared transformer-based and CNN/CRNN models for scene-text recognition on standard benchmarks, analysing why attention-based models handle irregular, real-world text better.'
    Beyond work:
      - bullet: 'Board games, especially social deduction.'
      - bullet: 'Volunteer tutor (TOP programme): 3 months of English and maths tutoring for middle-school students during COVID-19.'
      - bullet: 'Marathon finisher; now training for a sub-3:40.'
  sort_entries: none
