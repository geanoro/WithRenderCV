cv:
  name: Gianmarco Dancel Gamo
  location: Brescia, IT
  email: gamogianmarco@gmail.com
  phone: +39 324 825 1107
  website:
  social_networks:
    - network: LinkedIn
      username: gianmarcogamo
    - network: GitHub
      username: geanoro
  sections:
    summary:
      - 'Engineer who bridges electronics and software: I build industrial and embedded systems end to end — from sensors, motion control and custom trigger electronics up to the desktop and backend software that drives them.'
      - 'I ship systems that run on real production lines: cobot-driven quality control, confocal-sensor inspection at 60–100 units/min, real-time motion and acquisition. I step back to see the whole system and find the right abstraction, so future change is welcomed, not feared.'
    experience:
      - company: Freelance
        position: Full-Stack Engineer
        start_date: 2026-04
        end_date: present
        location: Brescia, IT
        summary:
        highlights:
          - 'Full-stack delivery for SMEs and professionals: web apps, WhatsApp/API integrations and automated document generation.'
      - company: Autosupermarket
        position: Full-Stack Engineer
        start_date: 2026-01
        end_date: 2026-04
        location: Brescia, IT
        summary:
        highlights:
          - 'Cut a high-traffic Symfony/Vue page from ~2,800 to ~10 database queries through batch loading and N+1 elimination.'
          - 'Shipped one-off digital contracts and expiring-subscription tracking.'
          - 'Built back-office tracking of post-sale customer-contact activities.'
      - company: Tecnosens SpA
        position: Software Engineer
        start_date: 2024-07
        end_date: 2026-01
        location: Brescia, IT
        summary:
        highlights:
          - 'Designed and delivered a wine-bottle QC system running at 60–100 bottles/min: confocal sensors and a linear algorithm detect bulges and sinks on rotating bottles inline, including PLC signals and custom start-trigger electronics.'
          - 'Built the WPF/.NET desktop system driving a cobot across multiple vial and cap types, orchestrating asynchronous motion and measurement-acquisition for dimensional QC.'
          - 'Re-architected the automotive-glass QC system from scratch so different distance sensors and acquisition timings can be combined within one measurement pipeline.'
          - 'Built the system-alignment workflow, minimising operator clicks during machine setup.'
    projects:
      - name: 'Pyromac Portal'
        start_date: 2025-10
        end_date: 2026-02
        summary:
        highlights:
          - 'Delivered a production onboarding portal end to end (front-end + backend): a multi-step flow for legal agreements, owner data and contract signing, with SMS/email OTP verification and legally certified timestamping.'
          - 'Integrated a Google-powered RAG assistant, letting users query product manuals conversationally.'
      - name: 'Device Test System (Pyromac)'
        start_date: 2026-05
        end_date: present
        summary:
        highlights:
          - 'Built the desktop front-end and orchestration backend for an automated device-test bench: test sequencing, result logging and persistence, over an Arduino/RS485 hardware layer.'
      - name: 'Thesis: "OCR in the Wild"'
        start_date: 2024-03
        end_date: 2024-03
        summary:
        highlights:
          - 'Surveyed OCR end to end: from classical computer-vision algorithms (OpenCV) to CRNN and transformer-based models.'
          - 'Worked through the foundations of modern deep learning (backpropagation, attention), comparing state-of-the-art models against traditional approaches across vision and NLP.'
    education:
      - institution: Università degli Studi di Brescia
        area: Engineering of Digital Enterprise Technologies (ITID)
        degree: BSc
        grade: 109/110
        start_date: 2020-09
        end_date: 2024-03
        location: Brescia, IT
        summary: 'Coursework: Microservice Architecture, Computer Architecture, Big Data, Cyber Security, Information Theory, Embedded Systems, User Experience.'
        highlights:
          - 'GREEN FBK: embedded-systems workshop on smart cities; built an air-quality monitor in C.'
      - institution: IIS Benedetto Castelli
        area: Computer Science, Telecommunications
        degree: Diploma
        grade: 100 cum laude
        start_date: 2015-09
        end_date: 2020-06
        location: Brescia, IT
        summary: 'Coursework: Telecommunications, TCP/IP, fiber optics, C, Python, Java.'
        highlights:
          - 'WebValley 2019: selected for a competitive AI & Health summer research camp; built a cardiovascular-risk model and a microbiota-risk analysis in Python.'
    skills:
      - label: Languages
        details: 'C, C++, C#, Python, JavaScript, Go, SQL, PHP, Java'
      - label: Embedded & Industrial
        details: 'Real-time motion & acquisition control, confocal & distance sensors, PLC signal integration, RS485/serial, custom trigger electronics, cobot integration'
      - label: Software & Tools
        details: '.NET Framework / WPF, FastAPI, React, Vue, Symfony, Docker, Git, CI/CD pipelines'
      - label: Interests
        details: 'Runner (marathon finisher), boardgames, videogames'
  sort_entries: none
