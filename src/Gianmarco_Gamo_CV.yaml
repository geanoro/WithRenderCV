  sections:
    summary:
      - 'Software Engineer who builds end to end — from .NET/WPF desktop interfaces to the database architecture and computer-vision pipelines behind them.'
      - 'Shipped the first production release of an industrial measurement system on a 5-month timeline.'
      - 'Background in IoT, telecommunications and signal processing; picks up new stacks fast.'
    experience:
      - company: Tecnosens SpA
        position: Software Engineer
        start_date: 2024-07
        end_date: present
        location: Brescia, IT
        summary:
        highlights:
          - 'Built the full desktop application (WPF, .NET Framework) for a cobot-driven optical measurement system, owning the UI end to end.'
          - 'Designed and implemented the database architecture supporting multiple geometry types, letting the system handle heterogeneous measurement applications.'
          - 'Developed a computer-vision routine for automatic ROI detection during strain capture of glass objects, removing a manual setup step.'
          - 'Ran repeatability & reproducibility (R&R) analysis to validate measurement accuracy.'
          - 'Delivered the first production release within a 5-month development timeline.'
    projects:
      - name: 'Thesis — OCR in the Wild'
        start_date: 2024-03
        end_date: 2024-03
        summary:
        highlights:
          - 'Surveyed classical and modern OCR methods, deep-diving CRNN architectures.'
          - 'Compared transformer-based state-of-the-art approaches against traditional pipelines across vision and NLP tasks.'
      - name: WebValley 2019
        date: 2019-07
        summary: 'Selected for an internationally competitive AI & Health summer research camp.'
        highlights:
          - 'Implemented the SCORE cardiovascular-risk algorithm and analyzed microbiota–risk correlations via Differential Network Analysis.'
          - 'Tools: Python, Anaconda.'
      - name: GREEN FBK 2019
        date: 2019-07
        summary: 'One-week embedded-systems workshop on smart cities.'
        highlights:
          - 'Built an air-quality monitor detecting alcohol levels (C).'
    education:
      - institution: Università degli Studi di Brescia
        area: Engineering of Digital Enterprise Technologies (ITID)
        degree: BSc
        grade: 109/110
        start_date: 2020-09
        end_date: 2024-03
