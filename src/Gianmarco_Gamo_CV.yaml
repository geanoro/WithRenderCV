        degree: Diploma
        grade: 100 cum laude
        start_date: 2015-09
        end_date: 2020-06
        location: Brescia, IT
        summary: 'Coursework: Telecommunications systems, TCP/IP, fiber optics, C, Python, Java.'
        highlights: []
    skills:
